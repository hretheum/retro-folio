name: Basic Functionality Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  basic-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Basic Functionality Tests
      run: npm test -- --testNamePattern="Basic Functionality" --verbose --passWithNoTests
      continue-on-error: false
      
    - name: Run Context Pruning Tests
      run: npm test -- --testNamePattern="Context Pruning" --verbose --passWithNoTests
      continue-on-error: false
      
    - name: Run Context Cache Tests
      run: npm test -- --testNamePattern="Smart Context Cache" --verbose --passWithNoTests
      continue-on-error: false
      
    - name: Run Hybrid Search Tests
      run: npm test -- --testNamePattern="Enhanced Hybrid Search" --verbose --passWithNoTests
      continue-on-error: false
      
    - name: Run Unified Chat Tests
      run: npm test -- --testNamePattern="Unified Intelligent Chat" --verbose --passWithNoTests
      continue-on-error: false
      
    - name: Run React Components Tests (Optional)
      run: npm test -- --testNamePattern="ErykChat|ErrorBoundary" --verbose --passWithNoTests
      continue-on-error: true
      
    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Basic Functionality Tests: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Context Pruning Tests: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Context Cache Tests: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Enhanced Hybrid Search Tests: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "- Unified Intelligent Chat Tests: ✅ Completed" >> $GITHUB_STEP_SUMMARY