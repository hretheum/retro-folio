name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true
      
    - name: Run unit tests
      run: npm test -- --coverage
      
    - name: Run E2E tests
      run: npm run test:e2e
      continue-on-error: true
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        
    - name: Build project
      run: npm run build
      
  phase-1-validation:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Phase 1 validation tests
      run: npm test -- --testNamePattern="Dynamic Context Sizing Unit Tests|Query Intent Analysis" --verbose
      
    - name: Check classification accuracy
      run: |
        echo "Checking classification accuracy..."
        npm test -- --testNamePattern="Classification accuracy" --silent
        
  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Run security tests
      run: npm run test:security
      continue-on-error: true
      
  performance:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run performance tests
      run: npm run test:performance
      continue-on-error: true
      
  deploy-preview:
    runs-on: ubuntu-latest
    needs: [test, phase-1-validation]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for preview
      run: npm run build
      
    - name: Deploy to preview
      run: |
        echo "Deploying to preview environment..."
        echo "Preview URL would be available here"
        
  notify:
    runs-on: ubuntu-latest
    needs: [test, phase-1-validation, security, performance]
    if: always()
    
    steps:
    - name: Notify status
      run: |
        if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.phase-1-validation.result }}" = "success" ]; then
          echo "✅ All tests passed! Ready for merge."
        else
          echo "❌ Some tests failed. Please check the logs."
          exit 1
        fi